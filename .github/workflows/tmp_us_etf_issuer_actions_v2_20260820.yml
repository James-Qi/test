name: tmp-us-etf-issuer-actions-v2-20260820

on:
  pull_request:
    paths:
      - 'tmp/us_etf_issuer_actions_v2_trigger_20260820.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'pandas>=2.2,<3' 'openpyxl>=3.1,<4'
      - name: Fetch official issuer data
        run: python tmp/fetch_us_etf_issuer_actions_v2_20260820.py
      - name: Upload auditable issuer cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-etf-issuer-actions-v2-20260820
          path: artifact/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
