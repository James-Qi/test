name: tmp-us-etf-yahoo-cache

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-yahoo-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and normalize Yahoo chart data
        run: python tmp/fetch_yahoo_cache_20260819.py
      - name: Upload normalized cache
        uses: actions/upload-artifact@v4
        with:
          name: us-etf-yahoo-cache-20260819
          path: artifact/
          compression-level: 6
          retention-days: 7
          if-no-files-found: error
