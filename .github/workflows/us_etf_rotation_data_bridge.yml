name: US ETF rotation R0 data bridge

on:
  pull_request:
    paths:
      - "bridge/fetch_us_etf_rotation_data.py"
      - "bridge/us_etf_rotation_request.json"
      - ".github/workflows/us_etf_rotation_data_bridge.yml"

permissions:
  contents: write

jobs:
  fetch-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas==2.3.2" "pyarrow==21.0.0" "yfinance==0.2.65"

      - name: Fetch Yahoo chart history and corporate actions
        run: python bridge/fetch_us_etf_rotation_data.py --request bridge/us_etf_rotation_request.json --output-dir bridge/output

      - name: Upload immutable bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: us-etf-rotation-r0-yahoo-bridge
          path: bridge/output/
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated bridge output to the PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge/output
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "data: freeze Yahoo R0 bridge output"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
